# Typecheck and build on every push and pull request.
#
# There is no test suite, so this is what "CI" can honestly mean here: the
# TypeScript project builds, and the Prisma schema is valid. Both catch the
# class of mistake that actually breaks this repo — a type that drifted between
# the client and the server, since src/types.ts is imported by both.
#
# Deployment is Vercel's git integration rather than a job here: it already
# builds from this branch, and two things racing to deploy the same commit is
# how you get a half-deployed app.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The client is generated from the schema, and nothing typechecks
      # without it.
      - run: npx prisma generate

      - name: Validate the Prisma schema
        # `prisma validate` resolves env() in the datasource block before it
        # parses anything, so it fails without DATABASE_URL even though it
        # never opens a connection. A placeholder is the whole fix — CI has no
        # database and does not need one.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      # Mechanical documentation checks. Catches the drift a person cannot be
      # relied on to notice: counts quoted in prose, routers that exist but are
      # never mounted, modules with no title, and the three link tables that
      # have to agree with each other.
      - name: Check the docs against the code
        run: npm run check:docs

      - name: Build
        run: npm run build
